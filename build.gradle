plugins {
    id 'java'
}

group = 'cr'
version = '0.1'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

repositories { mavenCentral() }

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

test {
    useJUnitPlatform()
    testLogging { events 'failed'; exceptionFormat 'full' }
}

def prop(String name, String dflt) { project.hasProperty(name) ? project.property(name).toString() : dflt }

// Validate the rules engine against downloaded CG replays: -Preplays=replays/cg (file or directory)
// [-Presync=true] [-PlogResync=true] [-Pquiet=true] [-PdumpState=true] [-Pconsts=NAME=v,ARR[i]=v]
tasks.register('cgValidate', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'cr.tools.CgValidate'
    args prop('replays', 'replays/cg'), prop('verbose', '0')
    ['dumpState', 'quiet', 'resync', 'logResync', 'consts'].each { if (project.hasProperty(it)) systemProperty it, project.property(it) }
}

// Which code an arena agent ran: its validated CG games against a bot's lines (replays and agent required)
// -Preplays=replays/arena/<version>/<league>/upload-NN/games -Pagent=<agentId> [-Pbot=submit|file:<Player.java>|<spec>]
tasks.register('cgAttribute', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'cr.tools.CgAttribute'
    args prop('replays', ''), prop('bot', 'submit'), prop('agent', '')
}

// One reproducible match: -Pbot0=current -Pbot1=v00 -Pseed=1 -Pprint=0 [-Pout=build/replays/local/s1.json]
tasks.register('run', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'cr.runner.LocalRunner'
    args prop('bot0', 'current'), prop('bot1', 'v00'), prop('seed', '1'), prop('print', '0'), prop('out', '')
}

// Arena dashboard and recorded replay viewer: http://localhost:8765/visualizer/ (also ?file=...)
tasks.register('serve', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'cr.tools.Serve'
    args prop('port', '8765')
}

// Paired bench: -Pbot1=current -Pbot2=v00 -Pmaps=100 -Pthreads=8 -PseedBase=1000 -PturnMs=50 [-Pout=replays/bench/<exp>/<name>.json]
// [-PseedStride=397: maps seedBase + k * stride, as P2's blocks since PV3, docs/local-screen.md]
tasks.register('bench', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'cr.runner.BenchmarkRunner'
    args prop('bot1', 'current'), prop('bot2', 'v00'), prop('maps', '100'), prop('threads', '8'), prop('seedBase', '1000'), prop('turnMs', '50'), prop('out', ''), prop('seedStride', '1')
}

// Per-player features of recorded CG games (replayed through Rules): -Pout=<file.csv> -Preplays=<dirs or files, space-separated>
tasks.register('cgStudy', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'cr.tools.CgStudy'
    args([prop('out', 'build/study.csv')] + prop('replays', 'replays/cg2').split(' ').toList())
}

// Our queen's turns under enemy tower fire in recorded CG games, by what she was doing (cr.tools.TowerFire):
// -Pagents=<agentId,agentId...> [-Plines=1] -Preplays=<dirs or files, space-separated>
tasks.register('towerFire', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'cr.tools.TowerFire'
    args([prop('agents', '')] + (prop('lines', '0') == '1' ? ['lines'] : []) + prop('replays', '').split(' ').toList())
}

// Queen traces of recorded CG games (cr.tools.DeathTrace), printed to stdout (run with -q and redirect):
// -Pagent=<agentId> [-Pall=1] [-Pfoe=1] -Preplays=<dirs or files, space-separated>
tasks.register('deathTrace', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'cr.tools.DeathTrace'
    def flags = []
    if (prop('all', '0') == '1') flags << 'all'
    if (prop('foe', '0') == '1') flags << 'foe'
    args([prop('agent', '')] + flags + prop('replays', '').split(' ').toList())
}

// A bot's local profile in the arena studies' terms (cr.tools.LocalProfile), botA on both seats against botB:
// -PbotA=v08 -PbotB=field -Pmaps=200 -PseedBase=150000 [-PseedStride=397: maps seedBase + k * stride, all 16 starting HPs]
tasks.register('localProfile', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'cr.tools.LocalProfile'
    args prop('botA', 'current'), prop('botB', 'v08'), prop('maps', '100'), prop('seedBase', '10000'), prop('seedStride', '1')
}

// Our knight waves and their damage to the enemy queen (cr.tools.WaveScan), botA on both seats against botB:
// -PbotA=v09 -PbotB=rival -Pmaps=500 -PseedBase=1 -PseedStride=397
tasks.register('waveScan', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'cr.tools.WaveScan'
    args prop('botA', 'current'), prop('botB', 'v09'), prop('maps', '100'), prop('seedBase', '1'), prop('seedStride', '397')
}

// Queen stalls (BUILD to an untouched site, queen did not move) of a bot on both seats:
// -Pbot=current -Popp=v01 -Pmaps=500 -PseedBase=10000 [-Pthreads=8]
tasks.register('stallScan', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'cr.tools.StallScan'
    args prop('bot', 'current'), prop('opp', 'v01'), prop('maps', '500'), prop('seedBase', '10000'), prop('threads', '8')
}

// Walking legs of a bot's queen (turns, excess, slides, abandoned legs, landing potential, play() time) on both seats:
// -Pbot=current?ROUTE=1 -Popp=v03 -Pmaps=300 -PseedBase=110000 [-Pthreads=8] [-Pout=<dir for the summary and the per-game csv>]
tasks.register('legScan', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'cr.tools.LegScan'
    args prop('bot', 'current'), prop('opp', 'v03'), prop('maps', '300'), prop('seedBase', '110000'), prop('threads', '8'), prop('out', '')
}

// Merge shipped sources into build/submit/Player.java and compile it: -Pparams="K=v,..."
tasks.register('submit', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'cr.submit.FileMerger'
    args prop('params', '')
}

// Identity of an artifact file as one JSON line (sha256, params, build id, config id): -Pfile=<Player.java>
tasks.register('artifactInfo', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'cr.submit.ArtifactInfo'
    args prop('file', '')
}

// Run the merged artifact as a process on both seats: -Popp=v00 -Pgames=5 -PseedBase=1
tasks.register('procCheck', JavaExec) {
    dependsOn 'submit'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'cr.runner.ProcessCheck'
    args prop('opp', 'v00'), prop('games', '5'), prop('seedBase', '1')
}
